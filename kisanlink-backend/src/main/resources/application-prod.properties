# ── Production profile — loaded when spring.profiles.active=prod ──────────────
# This profile intentionally has no JWT secret default.
# If JWT_SECRET is not set in the environment, the application will fail to start.
# This prevents accidentally running production authentication with a known fallback secret.
#
# To activate: set SPRING_PROFILES_ACTIVE=prod in your deployment environment.

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Require JWT_SECRET — no fallback in production (Review 5 fix)
# The application will throw a startup error if this is missing.
jwt.secret=${JWT_SECRET}

# Require explicit expiry configuration in production
jwt.expiration=${JWT_EXPIRATION}
