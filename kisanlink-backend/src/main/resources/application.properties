spring.application.name=kisanlink-backend
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
jwt.expiration=${JWT_EXPIRATION:86400000}

server.port=${PORT:8080}
server.tomcat.basedir=target/tomcat
server.servlet.session.persistent=false

# SMS delivery: simulated by default; set KISANLINK_SMS_MODE=real for MSG91.
# The MSG91 template must contain a single variable named VAR1 for the message text.
kisanlink.sms.mode=${KISANLINK_SMS_MODE:simulated}
kisanlink.sms.msg91.auth-key=${MSG91_AUTH_KEY:}
kisanlink.sms.msg91.template-id=${MSG91_TEMPLATE_ID:}
kisanlink.sms.msg91.sender-id=${MSG91_SENDER_ID:}

# ── Transport cost model ─────────────────────────────────────────────────────
# Base fixed charge per trip (₹) regardless of distance
kisanlink.transport.base-charge=100.00
# Variable cost per kilometre (₹/km)
kisanlink.transport.rate-per-km=15.00
# Maximum distance (km) to consider a buyer; beyond this threshold they are excluded
kisanlink.transport.max-distance-km=500.0

# ── Recommendation scoring weights ───────────────────────────────────────────
# Weights must sum to 1.0
# Financial return after transport cost
kisanlink.scoring.weight.net-margin=0.40
# Competitiveness of offered price vs. other candidates
kisanlink.scoring.weight.price=0.30
# Proximity bonus (closer buyer = lower logistical risk)
kisanlink.scoring.weight.proximity=0.20
# Buyer trust/verification bonus
kisanlink.scoring.weight.buyer-trust=0.10
